<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="icon" type="image/jpeg" href="assets/favicon.jpg?v=1">
  <meta name="theme-color" content="#0a0a0a">
  <title>VALORANT POINT GUIDE</title>
  <link rel="stylesheet" href="css/main.css?v=10">
  <link rel="stylesheet" href="css/menu.css?v=10">
  <link rel="stylesheet" href="css/map.css?v=21">
  <link rel="stylesheet" href="css/detail.css?v=10">
  <link rel="stylesheet" href="css/editor.css?v=10">
</head>
<body>
  <div id="app">
    <section id="page-menu" class="page">
      <div class="menu-bg-glow"></div>
    <div class="menu-bg-orb menu-bg-orb-1"></div>
    <div class="menu-bg-orb menu-bg-orb-2"></div>
    <div class="menu-bg-orb menu-bg-orb-3"></div>
      <div class="menu-container">
        <header class="menu-header">
          <div class="menu-logo">
            <img src="assets/valorant-logo.webp?v=1" alt="VALORANT" class="menu-logo-img" draggable="false">
          </div>
          <p class="menu-subtitle">点位攻略</p>
        </header>
        <div class="menu-grid" id="menu-grid"></div>
        <footer class="menu-footer">
          <span>选择地图 · 探索点位</span>
        </footer>
      </div>
    </section>

    <section id="page-map" class="page">
      <nav class="map-nav">
        <button class="nav-back" id="btn-back-menu" aria-label="返回菜单">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="map-nav-title" id="map-nav-title">穿墙点位</div>
        <div class="map-nav-spacer"></div>
        <button class="nav-save-btn" id="btn-save-points" title="保存全部点位到本地">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21H5C3.9 21 3 20.1 3 19V5C3 3.9 3.9 3 5 3H16L21 8V19C21 20.1 20.1 21 19 21Z"/>
            <path d="M7 3H16V8H7V3Z"/>
            <path d="M7 13H17V21H7V13Z"/>
          </svg>
          <span>保存</span>
        </button>
      </nav>

      <div class="map-tab-bar" id="map-tab-bar"></div>

      <div class="map-viewport" id="map-viewport">
        <div class="map-world" id="map-world">
          <img id="map-image" class="map-image" src="" alt="地图">
          <div id="points-container" class="points-container"></div>
        </div>
        <div id="detail-popup" class="detail-popup"></div>
      </div>

      <div class="map-controls">
        <button class="map-control-btn" id="btn-zoom-in" aria-label="放大">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        <div class="map-control-divider"></div>
        <button class="map-control-btn" id="btn-zoom-out" aria-label="缩小">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        <div class="map-control-divider"></div>
        <button class="map-control-btn" id="btn-reset" aria-label="重置视角">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12C21 16.9706 16.9706 21 12 21C9.5 21 7.5 20 5.5 18.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M3 12V7M3 12H8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </section>
  </div>

  <script src="js/pointsData.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/detailPopup.js"></script>
  <script src="js/mapEngine.js"></script>
  <script src="js/pointEditor.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
